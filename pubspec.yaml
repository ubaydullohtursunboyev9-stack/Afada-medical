name: afada
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.68.0
  provider: ^6.1.5
  mask_text_input_formatter: ^2.9.0
  currency_text_input_formatter: ^2.2.0
  video_player: ^2.10.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  flutter_screenutil: ^5.9.3
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  vibration: ^2.0.1
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  http: ^1.6.0
  connectivity_plus: ^6.1.0
  internet_connection_checker_plus: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
